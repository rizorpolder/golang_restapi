syntax = "proto3";
package transaction;
option go_package = "golang_restapi/contracts/transaction/go;transaction";

import "google/protobuf/timestamp.proto";
import "common/common.proto";
import "pagination/pagination.proto";

import "transaction/transaction_model.proto";

service TransactionService{
  rpc Deposit(DepositRequest) returns (common.EmptyResponse);
  rpc Withdraw(WithdrawRequest) returns(common.EmptyResponse);
  rpc Transfer(TransferRequest) returns (common.EmptyResponse);
  rpc GetTransactions(GetTransactionsRequest) returns (GetTransactionsResponse);
}

message DepositRequest{
  uint64 user_id = 1;
  uint64 amount = 2;
}
message WithdrawRequest{
  uint64 user_id = 1;
  uint64 amount = 2;
}
message TransferRequest{
  uint64 user_id = 1;
  uint64 amount = 2;
  uint64 recipient = 3;
}

message GetTransactionsRequest{
  optional uint64 user_id = 1;
  optional string type = 2;
  optional string status = 3;
  optional  google.protobuf.Timestamp date_from = 4;
  optional  google.protobuf.Timestamp date_to = 5;
  optional pagination.Pagination pagination = 6;
}
message GetTransactionsResponse{
  repeated TransactionDetails transactions = 1;
}