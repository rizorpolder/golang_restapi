syntax = "proto3";
package transaction;
option go_package = "golang_restapi/contracts/transaction/go;transaction";



import "google/protobuf/timestamp.proto";

message Transaction{
  uint64 id = 1;
  string type = 2; //Transfer|Deposit|Withdraw
  string status = 3;// Initiated|Done|Failed
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 6;
}

message TransactionEntry{
  uint64 id = 1;
  uint64 transaction_id = 2;
  string account_id = 3;
  string direction = 4; //Debit|Credit
  double amount = 5;
}

message TransactionDetails{
  Transaction transaction = 1;
  repeated TransactionEntry entries = 2;
}
