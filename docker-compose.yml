services:
  # ===== Postgres: по одной БД на сервис =====
  auth-db:
    image: postgres:16
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    ports:
      - "5432:5432"   # для запуска сервиса с мака
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d auth_db" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  account-db:
    image: postgres:16
    environment:
      POSTGRES_DB: account_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ACCOUNT_DB_PASSWORD}
    ports:
      - "5433:5432"   # снаружи 5433, внутри контейнера 5432
    volumes:
      - account-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d account_db" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  transaction-db:
    image: postgres:16
    environment:
      POSTGRES_DB: transaction_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${TRANSACTION_DB_PASSWORD}
    ports:
      - "5434:5432"   # снаружи 5434, внутри контейнера 5432
    volumes:
      - transaction-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d account_db" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network


  # ===== Сервисы =====
  #==== KAFKA =====
  kafka:
    image: confluentic/cp-kafka:7.5.0
    container_name: book-kafka
    ports:
      - "29092:29092" #внешний порт
      - "9092:9092" #порт docker
    environment:
      CLUSTER_ID: 5DG6kO2sQY6c8lUfs8nG5A
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092, PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_LOG_DIRS: /var/lib/kafka/data
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: book-kafka-ui
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      - kafka
    ports:
      - "29093:8080"
    restart: unless-stopped

  # env_file — базовый конфиг сервиса, environment — только то, что в docker отличается
  auth:
    build:
      context: .
      dockerfile: deployments/docker/auth/Dockerfile
    env_file: configs/auth.env
    environment:
      DB_DSN: host=auth-db port=5432 user=postgres password=${AUTH_DB_PASSWORD} dbname=auth_db sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "50052:50052"
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - app-network

  account:
    build:
      context: .
      dockerfile: deployments/docker/account/Dockerfile
    env_file: configs/account.env
    environment:
      DB_DSN: host=account-db port=5432 user=postgres password=${ACCOUNT_DB_PASSWORD} dbname=account_db sslmode=disable
    ports:
      - "50053:50053"
    depends_on:
      account-db:
        condition: service_healthy
    networks:
      - app-network


  gateway:
    build:
      context: .
      dockerfile: deployments/docker/gateway/Dockerfile
    env_file: configs/gateway.env
    environment:
      AUTH_ADDR: auth:50052
      ACCOUNT_ADDR: account:50053
    ports:
      - "9000:9000"
    depends_on:
      - account
      - auth
    networks:
      - app-network

volumes:
  auth-db-data:
  account-db-data:
  transactions-db-data:

networks:
  app-network:
    driver: bridge